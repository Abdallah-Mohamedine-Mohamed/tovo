# =====================================================================
# Codemagic — build iOS du client Tovo, vers TestFlight
# =====================================================================
# Construit l'app CLIENT et la dépose sur TestFlight. Pas de Mac requis :
# Codemagic loue des machines macOS.
#
# CE FICHIER NE PUBLIE RIEN SUR L'APP STORE. Il dépose un build dans
# TestFlight, et rien d'autre. La version publique (2.0.0 build 4) reste
# intacte tant que personne ne crée et ne soumet une nouvelle version depuis
# App Store Connect — ce que ce pipeline ne fait pas et ne peut pas faire :
# `submit_to_app_store` est explicitement à `false`.
#
# UN SEUL BUNDLE EXISTE CÔTÉ iOS : com.tovoapp.UserApp, celui de l'app
# publiée. Contrairement à Android où trois flavors cohabitent
# (client / livreur / boutique), le projet iOS n'a qu'un schéma. Livreur et
# boutique demanderaient chacun un nouveau bundle, une nouvelle fiche App
# Store et de nouveaux profils — c'est un autre chantier.
#
# AVANT LE PREMIER BUILD, à faire une fois dans Codemagic :
#
#   1. Une clé API App Store Connect
#      App Store Connect > Utilisateurs et accès > Intégrations >
#      App Store Connect API > « + ». Rôle « App Manager » suffit, Admin
#      n'est pas nécessaire. Récupérer : Issuer ID, Key ID, fichier .p8.
#      Déjà fait : la clé « clé tovopay » (KQ62G77UN9) est enregistrée dans
#      Codemagic et couvre Tovo, puisque les deux apps partagent le compte.
#
#   2. Un groupe de variables `tovo_config` contenant, en SECRET :
#      SUPABASE_URL, SUPABASE_ANON_KEY, API_BASE_URL.
#      Ce sont les mêmes valeurs que celles passées à build_apks.sh. Elles
#      n'entrent jamais dans le dépôt.
#
#   3. Dans App Store Connect > TestFlight > Tests internes, ajouter les
#      testeurs. Les tests INTERNES ne passent par aucune relecture Apple :
#      le build est disponible quelques minutes après le traitement. Les
#      groupes EXTERNES exigent une « Beta App Review » — inutile ici.

workflows:
  ios-client-testflight:
    name: Tovo client — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - tovo_config
      vars:
        # L'app publiée. Ne jamais modifier : changer ce bundle créerait une
        # nouvelle fiche et ferait perdre les utilisateurs existants.
        BUNDLE_ID: com.tovoapp.UserApp
        APP_APPLE_ID: 6740201431

        # 4.1.0, et non le 2.1.0 de pubspec.yaml.
        #
        # App Store Connect porte déjà une 4.0.12 (build 12, 22 août 2025).
        # Un nom de version inférieur passerait sur TestFlight, mais rendrait
        # la liste des builds incompréhensible — une 2.1.0 posée sous une
        # 4.0.12, et personne ne saurait laquelle est la plus récente.
        #
        # Le nom vit ici plutôt que dans pubspec.yaml : celui-ci sert aux
        # APK Android, dont la numérotation n'a jamais suivi celle d'iOS.
        NOM_VERSION: 4.1.0

      # SIGNATURE AUTOMATIQUE, une fois le certificat déposé dans Codemagic.
      #
      # Le build précédent a buté sur « Cannot save Signing Certificates
      # without certificate private key ». La cause est simple : un
      # certificat de distribution ne s'utilise qu'avec la clé privée qui a
      # servi à le demander. Apple ne la redonne jamais — elle vit sur le Mac
      # qui a créé le certificat, et aucune API ne la restitue.
      #
      # `fetch-signing-files --create` ne pouvait donc ni récupérer le
      # certificat existant, ni en fabriquer un. Il a produit un
      # export_options.plist vide, et l'archive a échoué trois étapes plus
      # loin sur « Runner requires a provisioning profile ».
      #
      # La parade tient en un clic, côté Codemagic : Settings > Code signing
      # identities > iOS certificates > « Generate certificate ». Codemagic
      # crée le certificat chez Apple ET garde la clé privée. Ces deux lignes
      # lui disent alors quoi signer ; il s'occupe du profil.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tovoapp.UserApp

    integrations:
      # Une clé API App Store Connect appartient à un COMPTE Apple, jamais à
      # une app : elle ouvre toutes celles de l'équipe. Les deux clés
      # enregistrées dans Codemagic — « clé tovopay » et « lenqueteur » —
      # relèvent du même compte, donc les DEUX conviendraient.
      #
      # Celle-ci est retenue parce qu'elle est ÉPROUVÉE : elle envoie déjà
      # des builds TovoPay. L'autre n'a jamais servi pour ce compte-ci, et
      # une clé peut avoir un rôle trop restreint pour créer un profil ou
      # téléverser — ça ne se voit qu'à l'échec.
      #
      # Si le build s'arrête à la signature, remplacer par « lenqueteur »
      # est la première chose à essayer. Le nom doit correspondre au
      # caractère près à celui de Settings > Integrations > Developer Portal.
      app_store_connect: "clé tovopay"

    triggering:
      # Aucun déclenchement automatique. Un build iOS part chez Apple : il se
      # lance à la main, quand on a décidé de tester quelque chose.
      events: []

    scripts:
      - name: Paquets Flutter
        script: flutter pub get

      # LE NUMÉRO DE BUILD EN PREMIER, parce que la préparation du projet
      # l'inscrit dans la configuration Xcode. Calculé après, il arriverait
      # trop tard.
      - name: Numéro de build
        script: |
          # Apple REFUSE un build dont le numéro n'est pas strictement
          # supérieur au précédent. On lit le dernier connu plutôt que de
          # tenir le compte à la main.
          DERNIER=$(app-store-connect get-latest-testflight-build-number \
                      "$APP_APPLE_ID" --platform IOS 2>/dev/null || echo "")
          if [ -z "$DERNIER" ]; then
            # Repli si l'API ne répond pas. 12 est le plus haut build déjà
            # chargé — la 4.0.12 du 22 août 2025, visible dans TestFlight.
            DERNIER=12
          fi
          echo "NUMERO_BUILD=$((DERNIER + 1))" >> "$CM_ENV"

      # FLUTTER PRÉPARE, IL NE COMPILE PAS.
      #
      # `--config-only` écrit Generated.xcconfig — les dart-define, le nom de
      # version, le numéro de build — et fait passer toutes les migrations du
      # projet Xcode : cible portée à 15.0, intégration Swift Package Manager,
      # migration UIScene. Un build précédent a montré que ces migrations
      # RÉÉCRIVENT project.pbxproj ; les faire avant la signature évite
      # qu'elles n'effacent ce qu'on vient d'y inscrire.
      - name: Préparer le projet iOS
        script: |
          flutter build ios --config-only --release --no-codesign \
            -t lib/main_client.dart \
            --build-name="$NOM_VERSION" \
            --build-number="$NUMERO_BUILD" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # LA SIGNATURE SE RÉAPPLIQUE ICI, APRÈS LES MIGRATIONS.
      #
      # Codemagic signe avant les scripts, à partir du bloc `ios_signing` :
      # il télécharge le certificat et le profil, et configure le projet.
      # Puis `flutter build ios --config-only` réécrit project.pbxproj pour
      # ses migrations, et remet CODE_SIGN_STYLE à Automatic — le relevé du
      # build précédent le montrait noir sur blanc, trois fois.
      #
      # `use-profiles` repose les réglages sur le projet stabilisé, et
      # produit au passage /Users/builder/export_options.plist, que
      # `xcode-project build-ipa` attend par défaut et qui manquait.
      - name: Appliquer la signature au projet
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

          echo "===== profils trouvés ====="
          ls -1 ~/Library/MobileDevice/Provisioning Profiles/ 2>/dev/null
          ls -1 ~/Library/Developer/Xcode/UserData/Provisioning Profiles/ 2>/dev/null

          echo "===== identités de signature ====="
          security find-identity -v -p codesigning || true

          echo "===== ce que le projet porte désormais ====="
          grep -nE "PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM|CODE_SIGN_STYLE" \
            ios/Runner.xcodeproj/project.pbxproj | head -12

          # ON VÉRIFIE LE CONTENU, PAS L’EXISTENCE. Un premier contrôle se
          # contentait de la présence du fichier ; il est toujours écrit,
          # même vide — « Provisioning Profiles: [] », « Team Id: » — et le
          # build continuait trois étapes de plus avant d’échouer.
          if ! grep -q "provisioningProfiles" /Users/builder/export_options.plist 2>/dev/null; then
            echo "export_options.plist sans profil : la signature n'a pas pris." >&2
            exit 1
          fi

      # `xcode-project build-ipa`, ET NON `flutter build ipa`.
      #
      # Les deux archivent le même projet, mais pas de la même façon. Flutter
      # cherche lui-même une identité dans le trousseau et exige un certificat
      # de DÉVELOPPEMENT : il refusait le build avec « No development
      # certificates available », alors que le certificat de DISTRIBUTION
      # était en place et que l'étape précédente avait mis douze secondes à le
      # récupérer.
      #
      # L'outil de Codemagic archive avec les profils qu'il vient lui-même
      # d'installer, sans rien redécouvrir. Tout ce que Flutter devait
      # apporter — dart-define, version, numéro de build — est déjà écrit
      # dans Generated.xcconfig par l'étape de préparation.
      - name: Construire l'IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration

        # TestFlight, et rien de plus. La fiche publique n'est pas touchée.
        submit_to_testflight: true

        # EXPLICITE, alors que false est déjà la valeur par défaut. Ce
        # réglage est le seul qui sépare un test d'une mise en production :
        # il mérite d'être lisible plutôt que sous-entendu.
        submit_to_app_store: false

      email:
        recipients:
          - mohamedine@tovoapp.com
        notify:
          success: true
          failure: true
