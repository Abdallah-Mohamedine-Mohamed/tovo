name: tovo
description: "Tovo — livraison conversationnelle à Niamey."
publish_to: 'none'

# La version publiée sur les stores est 2.0.0 build 4 (avril 2025).
# Toute mise à jour doit avoir un build strictement supérieur, sinon les
# stores la refusent. Voir docs/app_identity.md.
version: 2.1.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Auth, Realtime et Storage. Les appels métier passent par notre backend,
  # pas directement par PostgREST : le calcul des prix et l'atomicité vivent
  # dans les fonctions Postgres, exposées via /cart et /orders.
  supabase_flutter: ^2.8.0

  http: ^1.2.2

  # Adressage par épingle GPS : à Niamey l'adresse postale n'existe pas,
  # le point GPS fait foi.
  geolocator: ^13.0.2

  # File de synchronisation hors ligne de l'app livreur : elle doit
  # survivre à la fermeture de l'app, donc au disque.
  shared_preferences: ^2.3.2

  # Notifications push. firebase_core est requis par firebase_messaging.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Photos de produits (boutiquier) et recherche par image (client).
  image_picker: ^1.1.2

  # Ouvrir une offre externe du comparateur, appeler un livreur.
  url_launcher: ^6.3.1

  # Message vocal. Beaucoup de clients parlent bien mieux le français
  # qu'ils ne l'écrivent sur un clavier de téléphone ; dicter sa commande
  # supprime une vraie barrière. L'enregistrement est compressé en AAC :
  # mesuré, six secondes de WAV pèsent 286 Ko contre 240 Ko pour une minute
  # d'AAC, et le réseau nigérien ne pardonne pas la différence.
  record: ^6.2.1

  # Icônes de catégories, dessinées et non photographiées.
  #
  # Vectorielles plutôt que PNG : ces neuf icônes sont des aplats de couleur
  # sans dégradé ni ombre, exactement le cas où le SVG gagne — 400 octets par
  # fichier contre 6 Ko en PNG @3x, et net à n'importe quelle taille, y
  # compris sur les écrans à forte densité que le catalogue de demain
  # utilisera.
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Génère les icônes de lancement pour toutes les densités Android et iOS.
  # Outil de développement uniquement : il produit des fichiers, il n'entre
  # pas dans l'application.
  flutter_launcher_icons: ^0.14.1

# Icônes de lancement.
#
# LE SYMBOLE, ET NON LE LOGOTYPE.
#
# Le fichier de marque porte le mot « TOVO » en entier. Sur une grille
# d'accueil, une icône fait douze millimètres : le mot y occuperait trois
# millimètres de large et ne se lirait pas. C'est pourquoi Uber affiche un
# carré et non son nom.
#
# Les deux images sont produites par test/generer_icone_test.dart, à partir
# de la même géométrie que le symbole affiché dans l'application — une
# seconde copie des coordonnées finirait par diverger.
#
# Le fond teal est déclaré ici plutôt que peint dans l'image : Android
# découpe l'icône selon la forme choisie par le constructeur — ronde,
# carrée, en goutte — et seul le centre survit à coup sûr.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icone-tovo.png
  adaptive_icon_background: "#006666"
  adaptive_icon_foreground: assets/branding/icone-tovo-premier-plan.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Icônes de catégories embarquées plutôt que téléchargées.
  #
  # Ce sont les neuf premières formes que voit le client en ouvrant Tovo :
  # elles doivent être là avant le réseau, pas après. Les neuf fichiers
  # pèsent moins de 4 Ko au total — les charger depuis le serveur coûterait
  # neuf allers-retours pour économiser un millième de l'APK.
  assets:
    - assets/icons/categories/

  # DM Sans, embarquée et non chargée à l'exécution.
  #
  # Le paquet google_fonts télécharge la police au premier lancement : sur un
  # réseau nigérien, ça donne une seconde de texte en police système avant
  # qu'il ne saute à autre chose sous les yeux du client. Les cinq fichiers
  # pèsent 390 Ko au total, une fois pour toutes.
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSans-ExtraBold.ttf
          weight: 800
